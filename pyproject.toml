[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-ai-review"
version = "0.1.0"
description = "基于 DeepSeek 的 C/C++ AI 代码审查工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
ai-code-review = "cpp_ai_review.cli:app"

[tool.setuptools.packages.find]
where = ["src"]